      templatefillmap:
        Image: liamisko123/test:v1
        ReplicasMax: 96
        ReplicasMin: 96
      listunknownobjectoptions: null
    - basename: my-statefulset
      objecttemplatepath: statefulset.yaml
      templatefillmap:
        Image: registry.k8s.io/pause:3.9
        ReplicasMax: 32
        ReplicasMin: 32
      listunknownobjectoptions: null
    - basename: my-deployment-small
      objecttemplatepath: deployment_small.yaml
      templatefillmap:
        Image: liamisko123/test:v1
        ReplicasMax: 10
        ReplicasMin: 10
      listunknownobjectoptions: null
    - basename: my-statefulset-small
