name: Hyper-Benchmark
dependencies: []
automanagednamespaces: 0
namespace:
  number: 1
  prefix: test-waulxj
  deletestalenamespaces: false
  deleteautomanagednamespaces: true
  enableexistingnamespaces: false
  deletenamespacetimeout: 600000000000
steps:
- phases: []
  measurements:
  - method: GenericPrometheusQuery
    params:
      action: start
      metricName: API request latency
      metricVersion: v1
      queries:
      - name: P99_api
        query: histogram_quantile(0.99, sum(rate(apiserver_request_sli_duration_seconds_bucket[%v]))
          by (le))
      - name: P90_api
        query: histogram_quantile(0.9, sum(rate(apiserver_request_sli_duration_seconds_bucket[%v]))
          by (le))
      - name: P50_api
        query: histogram_quantile(0.5, sum(rate(apiserver_request_sli_duration_seconds_bucket[%v]))
          by (le))
      - name: avg_cpu
        query: avg(sum by (instance) (rate(node_cpu_seconds_total{mode!="idle", instance!="192.168.137.2:9100"}[%v])))
      - name: avg_cpu_system
        query: avg(sum by (instance) (rate(node_cpu_seconds_total{mode="system", instance!="192.168.137.2:9100"}[%v])))
      - name: avg_mem
        query: avg(avg_over_time((node_memory_MemTotal_bytes{instance!="192.168.137.2:9100"}
          - node_memory_MemAvailable_bytes{instance!="192.168.137.2:9100"})[%v:1s]))
          / 1024 / 1024
      - name: avg_disk_space
        query: avg(increase(node_disk_written_bytes_total{instance!="192.168.137.2:9100"}[%v]))
          / 1024 / 1024
      - name: avg_disk_latency
        query: avg(rate(node_disk_write_time_seconds_total{instance!="192.168.137.2:9100"}[%v]))
      - name: avg_net
        query: avg(rate(node_network_receive_bytes_total{instance!="192.168.137.2:9100"}[%v]))
          / 1024 / 1024
      - name: sum_net_total
        query: sum(increase(node_network_receive_bytes_total{instance!="192.168.137.2:9100"}[%v]))
          / 1024 / 1024
      unit: s,s,s,cpus,MB,MB,s,MB
    identifier: gq_all
    instances: []
  - method: APIResponsivenessPrometheus
    params:
      action: start
    identifier: APIResponsivenessPrometheus
    instances: []
  - method: PodStartupLatency
    params:
      action: start
      labelSelector: group = load
      threshold: 1h
    identifier: PodStartupLatency
    instances: []
  module:
    path: ""
    params: {}
  name: Start measurements global
- phases:
  - namespacerange:
      min: 1
      max: 1
      basename: null
    namespacelist: []
    replicaspernamespace: 1
    tuningset: Sequence
    objectbundle:
    - basename: service
      objecttemplatepath: service.yaml
      templatefillmap: {}
      listunknownobjectoptions: null
  measurements: []
  module:
    path: ""
    params: {}
  name: Creating services
- phases: []
  measurements:
  - method: WaitForControlledPodsRunning
    params:
      action: start
      labelSelector: group = load
      operationTimeout: 15m
    identifier: ""
    instances:
    - identifier: WaitForRunningDeployments
      params:
        apiVersion: apps/v1
        kind: Deployment
    - identifier: WaitForRunningStatefulSets
      params:
        apiVersion: apps/v1
        kind: StatefulSet
    - identifier: WaitForRunningDaemonSets
      params:
        apiVersion: apps/v1
        kind: DaemonSet
    - identifier: WaitForRunningJobs
      params:
        apiVersion: batch/v1
        kind: Job
  module:
    path: ""
    params: {}
  name: Start measurement for waiting for pods
- phases:
  - namespacerange:
      min: 1
      max: 1
      basename: null
    namespacelist: []
    replicaspernamespace: 1
    tuningset: RandomizedSaturationTimeLimited
    objectbundle:
    - basename: daemonset
      objecttemplatepath: daemonset.yaml
      templatefillmap:
        Image: liamisko123/test:v1
      listunknownobjectoptions: null
    - basename: my-configmap
      objecttemplatepath: configmap.yaml
      templatefillmap: {}
      listunknownobjectoptions: null
    - basename: my-secret
      objecttemplatepath: secret.yaml
      templatefillmap: {}
      listunknownobjectoptions: null
    - basename: my-deployment
      objecttemplatepath: deployment.yaml
      templatefillmap:
        EnableDNSTests: false
        Image: liamisko123/test:v1
        ReplicasMax: 60
        ReplicasMin: 60
        SvcName: my-service
      listunknownobjectoptions: null
    - basename: my-job
      objecttemplatepath: job.yaml
      templatefillmap:
        Image: liamisko123/test:v2
        ReplicasMax: 30
        ReplicasMin: 30
      listunknownobjectoptions: null
    - basename: my-statefulset
      objecttemplatepath: statefulset_service.yaml
      templatefillmap: {}
      listunknownobjectoptions: null
    - basename: my-statefulset
      objecttemplatepath: statefulset.yaml
      templatefillmap:
        Image: registry.k8s.io/pause:3.9
        ReplicasMax: 60
        ReplicasMin: 60
      listunknownobjectoptions: null
  measurements: []
  module:
    path: ""
    params: {}
  name: Creating objects
- phases: []
  measurements:
  - method: WaitForControlledPodsRunning
    params:
      action: gather
    identifier: ""
    instances:
    - identifier: WaitForRunningDeployments
      params: {}
    - identifier: WaitForRunningStatefulSets
      params: {}
    - identifier: WaitForRunningDaemonSets
      params: {}
    - identifier: WaitForRunningJobs
      params: {}
  module:
    path: ""
    params: {}
  name: Waiting for pods to be running
- phases: []
  measurements:
  - method: Sleep
    params:
      duration: 60s
    identifier: sleep
    instances: []
  module:
    path: ""
    params: {}
  name: Sleep
- phases: []
  measurements:
  - method: GenericPrometheusQuery
    params:
      action: gather
      enableViolations: true
    identifier: gq_all
    instances: []
  - method: APIResponsivenessPrometheus
    params:
      action: gather
    identifier: APIResponsivenessPrometheus
    instances: []
  - method: PodStartupLatency
    params:
      action: gather
    identifier: PodStartupLatency
    instances: []
  module:
    path: ""
    params: {}
  name: Gather measurements global
tuningsets:
- name: Sequence
  initialdelay: 0
  qpsload: null
  randomizedload: null
  steppedload: null
  timelimitedload: null
  randomizedtimelimitedload: null
  parallelismlimitedload:
    parallelismlimit: 1
  globalqpsload: null
  poissonload: null
- name: RandomizedSaturationTimeLimited
  initialdelay: 0
  qpsload: null
  randomizedload: null
  steppedload: null
  timelimitedload: null
  randomizedtimelimitedload:
    timelimit: 60000000000
  parallelismlimitedload: null
  globalqpsload: null
  poissonload: null
chaosmonkey:
  nodefailure: null
  excludednodes: {}
